services:
  udelvd-api:
    container_name: udelvd-api
    image: figonzal/udelvd-api:0.5-prod
    restart: on-failure
    environment:
      - auto_activacion=true
    ports:
      - "80:80"
    networks:
      - RED_UDELVD
    depends_on:
      - mysql
    
  #Definicion servicio mysql
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=udelvd
      - MYSQL_ROOT_HOST=%
      - TZ=America/Santiago
    ports:
      - "5021:3306"
    networks:
      - RED_UDELVD
    volumes:
      - db-data:/var/lib/mysql
      - ./script_sql:/docker-entrypoint-initdb.d:ro
      - ./mysql-files/my.cnf:/etc/mysql/conf.d/my.cnf:ro

networks:
  RED_UDELVD:
    name: RED_UDELVD
volumes:
  db-data: